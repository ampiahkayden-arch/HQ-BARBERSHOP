<!DOCTYPE html>
<html>
<head>
    <title>HQ | Barber Shop</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
        }

        nav {
            background: #111;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            text-align: center;
            padding: 120px 20px;
            background: #eeeeee;
        }

        .hero h1 {
            font-size: 55px;
            margin: 0 0 20px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            background: #111;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 6px;
        }

        .services {
            text-align: center;
            padding: 70px 20px;
        }

        .services h2 {
            font-size: 35px;
        }

        .service-box {
            display: inline-block;
            width: 220px;
            padding: 25px;
            margin: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <nav>
        <h2>HQ 💈</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <section class="hero">

        <h1>Look Sharp. Feel Fresh.</h1>

        <p>
            Professional haircuts and grooming
            for men who want to look their best.
        </p>

        <a href="#" class="button">Book an Appointment</a>

    </section>

    <section class="services">

        <h2>Our Services</h2>

        <div class="service-box">
            <h3>Haircut</h3>
            <p>Clean and professional haircut.</p>
        </div>

        <div class="service-box">
            <h3>Beard Trim</h3>
            <p>Sharp and clean beard grooming.</p>
        </div>

        <div class="service-box">
            <h3>Haircut + Beard</h3>
            <p>Complete grooming package.</p>
        </div>

    </section>

</body>
</html>
